    spot_check: [306, 315, 316]
    any:
      - tags_any: ["Nandotsavam", "Tenth Canto Kirtans", "Bala Leela"]
      - tags_any: ["Krishna Namavali"]
        deity_any: [Krishna, Govinda]
      - title_kw_any: [jananam, nandagopa, nandanandana, yasoda, devaki, gokula, uyyala, lali]
    boost_tags: ["Nandotsavam", "Tenth Canto Kirtans"]

