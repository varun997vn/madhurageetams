# Occasion taxonomy — the human-editable source of truth for the Occasion Finder.
#
# The master PDF has no occasion or festival field. It does have deity, ~540 category
# tags, and 97 index links, and between them the signal is there: Dolotsavam is Holi,
# Nandotsavam is Janmashtami, Pavvalimpu is a cradle song, and so on. This file is where
# that judgement lives, deliberately in YAML rather than in code so it can be corrected
# without touching the pipeline.
#
# To refine: edit this file, then `python run_all.py --from 20`. That re-enriches,
# rebuilds and repacks in seconds — it never re-reads the PDF.
#
# RULE SEMANTICS
#   any:   list of clauses. A song matches the occasion if ANY clause matches.
#          Within one clause, every key present must match (AND).
#   none:  a single clause. If it matches, the song is excluded even if `any` matched.
#   Keys:  tags_any / deity_any / indexed_any / composer_any  -> exact match after
#            canonicalisation, case- and diacritic-insensitive (folded key).
#          title_kw_any / lyrics_kw_any -> match a folded *token* in the title/lyrics,
#            so write plain ASCII: "krishna", not "kriShNa".
#   boost_tags: songs carrying these rank first within the occasion.
#   spot_check: song ids that MUST land in this occasion. Asserted by the test suite, so
#            a rule edit that quietly drops the obvious songs fails CI.
#
# Group determines where the card appears on the landing page.

occasions:

