name: Deploy to GitHub Pages

# The build pipeline never runs here. CI only bundles the app around the already
# encrypted, already committed web/public/data/*.enc, so no secret and no copy of the
# source PDF is ever needed by the workflow.

on:
  push:
    # Only the deployed branch. Listing a second branch here meant a push to either one
    # started a run, and since both share the `pages` concurrency group with
    # cancel-in-progress, whichever landed second silently cancelled the other's deploy.
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the source PDF ever entered history
        # The password gate is meaningless if the unencrypted corpus is fetchable from
        # the repo, so this is a hard gate rather than a lint.
        run: |
          if git log --all --diff-filter=A --name-only --pretty=format: | grep -qi '\.pdf$'; then
            echo "::error::A PDF was added somewhere in this repo's history."
            git log --all --diff-filter=A --name-only --pretty=format: | grep -i '\.pdf$' | sort -u
            exit 1
          fi
          echo "No PDF in history."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run test
        working-directory: web

      - name: Verify Python and TypeScript folding still agree
        # The index is built by mg/fold.py and queried by fold.ts. If they drift, indexed
        # tokens become unreachable and results silently vanish, so both run the shared
        # fixture on every deploy.
        #
        # test_script_shards.py self-skips the half that needs the private source dataset,
        # so what runs here is the shard-shape and naming contract — including that a
        # native shard can never be named `lyrics-*`, which would corrupt the Roman
        # shard lookup in data.worker.ts.
        run: |
          python -m pip install --quiet pytest PyYAML cryptography
          python -m pytest tests/test_fold.py tests/test_crypto.py tests/test_script_shards.py -q
        working-directory: build

      - name: Verify reader corrections are well-formed
        # corrections.json is committed by the review queue (suggestions/Code.gs) when the
        # admin accepts a reader's fix. The client skips malformed entries, so a bad commit
        # would otherwise deploy cleanly and publish nothing.
        run: python build/tools/verify_corrections.py web/public/data/corrections.json

      - run: npm run build
        working-directory: web

      - name: Verify the data shipped
        # public/data is committed, so the likeliest silent failure is deploying an app
        # with no corpus behind it. Assert shape and size before publishing.
        #
        # The native-script check exists because that failure already happened: the app was
        # deployed with the code but without the native data, and every song then showed a
        # dead Devanagari button. The counts here pass at exactly 34 shards, so nothing
        # caught it. Set ROMAN_ONLY=1 to deploy without native scripts deliberately.
        env:
          ROMAN_ONLY: ${{ vars.ROMAN_ONLY }}
        run: |
          cd web/dist
          test -f data/manifest.json || { echo "::error::manifest.json missing"; exit 1; }
          songs=$(python -c "import json;print(json.load(open('data/manifest.json'))['corpus']['songs'])")
          [ "$songs" = "7898" ] || { echo "::error::manifest reports $songs songs, expected 7898"; exit 1; }
          count=$(ls data/*.enc | wc -l)
          [ "$count" -ge 34 ] || { echo "::error::only $count .enc shards found, expected >= 34"; exit 1; }
          bytes=$(du -sb . | cut -f1)
          [ "$bytes" -lt 47185920 ] || { echo "::error::artifact is $bytes bytes, over the 45 MB budget"; exit 1; }

          set +e
          python ../../build/tools/verify_native_data.py data
          native=$?
          set -e
          if [ "$native" = "1" ]; then
            exit 1
          elif [ "$native" = "2" ] && [ "$ROMAN_ONLY" != "1" ]; then
            echo "::error::data/native-index.json is missing, so the site would ship with the"
            echo "::error::script picker hidden and no Devanagari or Tamil lyrics. Regenerate with:"
            echo "::error::  cd build && MG_SOURCE=/path/to/madhurageetams-source/data python 35_build_script_shards.py"
            echo "::error::then commit web/public/data. To deploy Roman-only on purpose, set the"
            echo "::error::repository variable ROMAN_ONLY=1."
            exit 1
          elif [ "$native" = "2" ]; then
            echo "::warning::deploying without native scripts (ROMAN_ONLY=1)"
          fi

          echo "OK: $songs songs, $count encrypted shards, $bytes bytes"

      - name: Ensure .nojekyll
        # Without it, GitHub Pages drops Vite's _-prefixed asset paths.
        run: touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed site
        # Catches a base-path mistake immediately, which is otherwise only visible as a
        # blank page in a browser.
        run: |
          BASE="${{ needs.deploy.outputs.page_url || 'https://varun997vn.github.io/madhurageetams/' }}"
          BASE="${BASE%/}/"
          echo "Checking $BASE"
          curl -fsS "${BASE}" -o /dev/null
          curl -fsS "${BASE}data/manifest.json" -o manifest.json
          python -c "
          import json,sys
          m=json.load(open('manifest.json'))
          assert m['corpus']['songs']==7898, m['corpus']
          assert len(m['shards'])>=34, len(m['shards'])
          print('manifest OK:', m['corpus']['songs'], 'songs,', len(m['shards']), 'shards')
          "
          curl -fsSI "${BASE}data/core.enc" | head -1
